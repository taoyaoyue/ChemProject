name: 镜像同步 Gitee to GitHub

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: 从 Gitee 镜像克隆并推到 GitHub
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          git clone --mirror https://gitee.com/peach_moon/chem_project.git repo.git
          cd repo.git
          git push --mirror https://${GH_USER}:${GH_TOKEN}@github.com/taoyaoyue/ChemProject.git